<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 210" width="760" height="210" role="img" aria-label="DiscLore '97 — 1997 Multimedia Study Disc">
  <title>DiscLore '97</title>

  <!-- Outer Win95 Window Frame -->
  <rect x="0" y="0" width="760" height="210" fill="#C0C0C0"/>
  <!-- Outer 3D Bevel -->
  <rect x="0" y="0" width="759" height="2" fill="#FFFFFF"/>
  <rect x="0" y="0" width="2" height="209" fill="#FFFFFF"/>
  <rect x="1" y="208" width="759" height="2" fill="#000000"/>
  <rect x="758" y="1" width="2" height="209" fill="#000000"/>
  <rect x="2" y="206" width="756" height="2" fill="#808080"/>
  <rect x="756" y="2" width="2" height="206" fill="#808080"/>

  <!-- Win95 Title Bar -->
  <rect x="4" y="4" width="752" height="24" fill="#000080"/>
  <!-- Mini title-bar CD icon -->
  <rect x="10" y="9" width="14" height="14" fill="#000000"/>
  <rect x="11" y="10" width="12" height="12" fill="#C0C0C0"/>
  <rect x="12" y="11" width="5" height="5" fill="#FFFFFF"/>
  <rect x="18" y="16" width="4" height="4" fill="#87CEFA"/>
  <rect x="15" y="14" width="4" height="4" fill="#808080"/>
  <rect x="16" y="15" width="2" height="2" fill="#000080"/>

  <text x="32" y="20" font-family="Tahoma, 'MS Sans Serif', Arial, sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF">DiscLore '97 — Multimedia Reference &amp; Study Disc</text>

  <!-- Win95 Title Bar Buttons [_] [□] [×] -->
  <g transform="translate(696, 7)">
    <!-- Minimize -->
    <rect x="0" y="0" width="18" height="18" fill="#C0C0C0"/>
    <rect x="0" y="0" width="17" height="1" fill="#FFFFFF"/>
    <rect x="0" y="0" width="1" height="17" fill="#FFFFFF"/>
    <rect x="0" y="17" width="18" height="1" fill="#000000"/>
    <rect x="17" y="0" width="1" height="18" fill="#000000"/>
    <rect x="4" y="12" width="8" height="2" fill="#000000"/>
    <!-- Maximize -->
    <rect x="20" y="0" width="18" height="18" fill="#C0C0C0"/>
    <rect x="20" y="0" width="17" height="1" fill="#FFFFFF"/>
    <rect x="20" y="0" width="1" height="17" fill="#FFFFFF"/>
    <rect x="20" y="17" width="18" height="1" fill="#000000"/>
    <rect x="37" y="0" width="1" height="18" fill="#000000"/>
    <rect x="24" y="4" width="10" height="2" fill="#000000"/>
    <rect x="24" y="4" width="1" height="10" fill="#000000"/>
    <rect x="33" y="4" width="1" height="10" fill="#000000"/>
    <rect x="24" y="13" width="10" height="1" fill="#000000"/>
    <!-- Close -->
    <rect x="40" y="0" width="18" height="18" fill="#C0C0C0"/>
    <rect x="40" y="0" width="17" height="1" fill="#FFFFFF"/>
    <rect x="40" y="0" width="1" height="17" fill="#FFFFFF"/>
    <rect x="40" y="17" width="18" height="1" fill="#000000"/>
    <rect x="57" y="0" width="1" height="18" fill="#000000"/>
    <line x1="45" y1="5" x2="53" y2="13" stroke="#000000" stroke-width="2"/>
    <line x1="53" y1="5" x2="45" y2="13" stroke="#000000" stroke-width="2"/>
  </g>

  <!-- Sunken Client Well -->
  <rect x="6" y="32" width="748" height="148" fill="#808080"/>
  <rect x="7" y="33" width="747" height="147" fill="#FFFFFF"/>
  <rect x="8" y="34" width="744" height="144" fill="#F4ECD8"/>

  <!-- Parchment Double Cartouche Border -->
  <rect x="14" y="40" width="732" height="132" fill="none" stroke="#C89B3C" stroke-width="1"/>
  <rect x="17" y="43" width="726" height="126" fill="none" stroke="#D8C9A8" stroke-width="1"/>

  <!-- Faint Engraved Watermarks (Right Side) -->
  <g stroke="#DFD2B5" fill="none" stroke-width="1.2">
    <!-- Ringed planet / orrery -->
    <circle cx="670" cy="102" r="28"/>
    <ellipse cx="670" cy="102" rx="48" ry="11"/>
    <line x1="670" y1="66" x2="670" y2="138"/>
    <line x1="634" y1="102" x2="706" y2="102"/>
    <!-- Orbiting CD rings -->
    <circle cx="590" cy="68" r="14"/>
    <circle cx="590" cy="68" r="4"/>
    <!-- Mini keep battlements -->
    <polyline points="560,154 560,132 568,132 568,138 576,138 576,132 584,132 584,138 592,138 592,132 600,132 600,154"/>
    <rect x="574" y="143" width="12" height="11"/>
  </g>

  <!-- Left Emblem: Stepped Pixel CD-ROM + Burgundy Study Tome -->
  <g transform="translate(36, 54)">
    <!-- CD-ROM Disc (72x72 stepped) -->
    <g shape-rendering="crispEdges">
      <rect x="20" y="2" width="32" height="4" fill="#000000"/>
      <rect x="12" y="6" width="8" height="4" fill="#000000"/>
      <rect x="52" y="6" width="8" height="4" fill="#000000"/>
      <rect x="20" y="6" width="32" height="4" fill="#FFFFFF"/>
      <rect x="8" y="10" width="4" height="6" fill="#000000"/>
      <rect x="60" y="10" width="4" height="6" fill="#000000"/>
      <rect x="12" y="10" width="48" height="6" fill="#FFFFFF"/>
      <rect x="4" y="16" width="4" height="40" fill="#000000"/>
      <rect x="64" y="16" width="4" height="40" fill="#000000"/>
      <rect x="8" y="16" width="56" height="40" fill="#C0C0C0"/>
      <!-- White highlight top-left quadrant -->
      <rect x="8" y="16" width="24" height="16" fill="#FFFFFF"/>
      <rect x="12" y="12" width="20" height="8" fill="#FFFFFF"/>
      <!-- Cyan/Sapphire optical glint bottom-right -->
      <rect x="42" y="38" width="18" height="12" fill="#87CEFA"/>
      <rect x="48" y="32" width="14" height="8" fill="#87CEFA"/>
      <rect x="38" y="46" width="14" height="10" fill="#0B2E59"/>
      <!-- Center Spindle -->
      <rect x="26" y="26" width="20" height="20" fill="#808080"/>
      <rect x="30" y="30" width="12" height="12" fill="#F4ECD8"/>
      <rect x="30" y="30" width="12" height="2" fill="#000000"/>
      <rect x="30" y="30" width="2" height="12" fill="#000000"/>
      <!-- Bottom edge -->
      <rect x="8" y="56" width="4" height="6" fill="#000000"/>
      <rect x="60" y="56" width="4" height="6" fill="#000000"/>
      <rect x="12" y="56" width="48" height="6" fill="#808080"/>
      <rect x="12" y="62" width="8" height="4" fill="#000000"/>
      <rect x="52" y="62" width="8" height="4" fill="#000000"/>
      <rect x="20" y="62" width="32" height="4" fill="#808080"/>
      <rect x="20" y="66" width="32" height="4" fill="#000000"/>
    </g>

    <!-- Overlapping Open Study Tome (bottom-right of CD) -->
    <g transform="translate(38, 44)">
      <rect x="0" y="0" width="48" height="34" fill="#000000"/>
      <rect x="2" y="2" width="44" height="30" fill="#7A1C24"/>
      <!-- Left & Right Ivory Pages -->
      <rect x="4" y="4" width="18" height="24" fill="#FFFFE1"/>
      <rect x="26" y="4" width="18" height="24" fill="#FFFFE1"/>
      <!-- Spine -->
      <rect x="22" y="2" width="4" height="28" fill="#541016"/>
      <!-- Ruled text lines -->
      <rect x="7" y="8" width="12" height="2" fill="#0B2E59"/>
      <rect x="7" y="13" width="10" height="2" fill="#808080"/>
      <rect x="7" y="18" width="12" height="2" fill="#808080"/>
      <rect x="7" y="23" width="8" height="2" fill="#808080"/>
      <rect x="29" y="8" width="12" height="2" fill="#7A1C24"/>
      <rect x="29" y="13" width="11" height="2" fill="#808080"/>
      <rect x="29" y="18" width="9" height="2" fill="#808080"/>
      <!-- Gold bookmark ribbon -->
      <rect x="36" y="26" width="4" height="10" fill="#C89B3C"/>
    </g>
  </g>

  <!-- Masthead Typography -->
  <text x="148" y="68" font-family="Tahoma, 'MS Sans Serif', Arial, sans-serif" font-size="11" font-weight="bold" letter-spacing="2.5" fill="#5C4D3C">MULTIMEDIA ENCYCLOPEDIA • EST. 1997</text>

  <text x="146" y="114" font-family="Georgia, 'Times New Roman', serif" font-size="44" font-weight="bold" letter-spacing="1" fill="#0B2E59">DISCLORE <tspan fill="#7A1C24">'97</tspan></text>

  <!-- Gold Rule -->
  <rect x="148" y="123" width="380" height="2" fill="#C89B3C"/>
  <rect x="148" y="125" width="380" height="1" fill="#7A1C24"/>

  <text x="148" y="146" font-family="Georgia, 'Times New Roman', serif" font-size="13.5" font-style="italic" fill="#1F1B16">Turn any Wikipedia topic, GitHub repo, web page, or Markdown into a portable study disc.</text>

  <!-- Bottom Win95 Status Bar -->
  <g transform="translate(6, 184)">
    <!-- Cell 1: Drive D: -->
    <rect x="0" y="0" width="210" height="20" fill="#C0C0C0"/>
    <rect x="0" y="0" width="209" height="1" fill="#808080"/>
    <rect x="0" y="0" width="1" height="19" fill="#808080"/>
    <rect x="0" y="19" width="210" height="1" fill="#FFFFFF"/>
    <rect x="209" y="0" width="1" height="20" fill="#FFFFFF"/>
    <rect x="8" y="6" width="8" height="8" fill="#000000"/>
    <rect x="9" y="7" width="6" height="6" fill="#C89B3C"/>
    <text x="22" y="14" font-family="Tahoma, 'MS Sans Serif', Arial, sans-serif" font-size="11" fill="#000000">Drive D:\DISCLORE97</text>

    <!-- Cell 2: Editions -->
    <rect x="214" y="0" width="300" height="20" fill="#C0C0C0"/>
    <rect x="214" y="0" width="299" height="1" fill="#808080"/>
    <rect x="214" y="0" width="1" height="19" fill="#808080"/>
    <rect x="214" y="19" width="300" height="1" fill="#FFFFFF"/>
    <rect x="513" y="0" width="1" height="20" fill="#FFFFFF"/>
    <text x="224" y="14" font-family="Tahoma, 'MS Sans Serif', Arial, sans-serif" font-size="11" fill="#000000">Editions: Classic '97 • Haunted • Christmas</text>

    <!-- Cell 3: Portable -->
    <rect x="518" y="0" width="230" height="20" fill="#C0C0C0"/>
    <rect x="518" y="0" width="229" height="1" fill="#808080"/>
    <rect x="518" y="0" width="1" height="19" fill="#808080"/>
    <rect x="518" y="19" width="230" height="1" fill="#FFFFFF"/>
    <rect x="747" y="0" width="1" height="20" fill="#FFFFFF"/>
    <text x="528" y="14" font-family="Tahoma, 'MS Sans Serif', Arial, sans-serif" font-size="11" fill="#000000">Portable .JSON Discs • Offline Ready</text>
  </g>
</svg>
